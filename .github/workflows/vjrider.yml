name: Generate vjRider Banner

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Banner
        run: |
          mkdir -p assets

          cat > assets/vjrider.svg << 'EOF'
          <svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
            <rect width="800" height="120" fill="#ffffff"/>
            <text x="20" y="60"
                  font-size="32"
                  font-family="monospace"
                  fill="#000000">
              vjRider
            </text>
          </svg>
          EOF

      - name: Commit SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto generate vjRider banner"