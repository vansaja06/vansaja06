name: Generate vjRider Banner

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Banner
        run: |
          mkdir -p assets

          cat > assets/vjrider.svg << 'EOF'
<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="800" height="120" fill="#ffffff"/>

  <!-- Ground -->
  <line x1="0" y1="90" x2="800" y2="90" stroke="#000000" stroke-width="2"/>

  <!-- Street Lamp -->
  <g transform="translate(700,18)">
    <rect x="8" y="0" width="4" height="72" fill="#000000"/>
    <rect x="8" y="0" width="20" height="4" fill="#000000"/>
    <rect x="26" y="2" width="6" height="6" fill="#000000"/>
  </g>

  <!-- Pixel Motorcycle -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="-120 0;850 0"
      dur="8s"
      repeatCount="indefinite"/>

    <!-- Rear Wheel -->
    <rect x="20" y="72" width="12" height="12" fill="#000000"/>

    <!-- Front Wheel -->
    <rect x="72" y="72" width="12" height="12" fill="#000000"/>

    <!-- Body -->
    <rect x="35" y="58" width="30" height="6" fill="#000000"/>
    <rect x="45" y="50" width="15" height="8" fill="#000000"/>
    <rect x="62" y="54" width="10" height="4" fill="#000000"/>

    <!-- Rider -->
    <rect x="48" y="36" width="10" height="10" fill="#000000"/>
    <rect x="50" y="46" width="6" height="10" fill="#000000"/>

    <!-- Frame -->
    <line x1="26" y1="72" x2="45" y2="58" stroke="#000000" stroke-width="2"/>
    <line x1="78" y1="72" x2="60" y2="58" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="20"
        y="35"
        fill="#000000"
        font-size="24"
        font-family="monospace"
        font-weight="bold">
    vjRider
  </text>

  <!-- Subtitle -->
  <text x="20"
        y="58"
        fill="#555555"
        font-size="12"
        font-family="monospace">
    Backend Developer • Cloud Enthusiast
  </text>

</svg>
EOF

      - name: Commit SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto generate vjRider banner"