name: Generate vjRider Banner

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Banner
        run: |
          mkdir -p assets

          cat > assets/vjrider.svg <<'EOF'
          <svg width="800" height="120"
               viewBox="0 0 800 120"
               xmlns="http://www.w3.org/2000/svg">

            <rect width="800" height="120" fill="#ffffff"/>

            <line x1="0" y1="90" x2="800" y2="90"
                  stroke="#000"
                  stroke-width="2"/>

            <g id="lamp" transform="translate(720,15)">
              <rect x="0" y="0" width="4" height="75" fill="#000"/>
              <rect x="0" y="0" width="20" height="4" fill="#000"/>
              <circle cx="20" cy="2" r="3" fill="#000"/>
            </g>

            <g id="car">
              <animateTransform
                attributeName="transform"
                type="translate"
                from="0 0"
                to="650 0"
                dur="4s"
                fill="freeze"/>

              <rect x="0" y="70" width="12" height="12" fill="#000"/>
              <rect x="50" y="70" width="12" height="12" fill="#000"/>

              <rect x="8" y="55" width="46" height="12" fill="#000"/>
              <rect x="18" y="45" width="24" height="10" fill="#000"/>

              <rect x="22" y="48" width="6" height="4" fill="#fff"/>
              <rect x="32" y="48" width="6" height="4" fill="#fff"/>
            </g>

            <g opacity="0">
              <set attributeName="opacity"
                   to="1"
                   begin="4s"
                   fill="freeze"/>

              <rect x="700" y="45" width="8" height="8" fill="#000"/>
              <rect x="712" y="38" width="8" height="8" fill="#000"/>
              <rect x="722" y="48" width="8" height="8" fill="#000"/>
              <rect x="706" y="58" width="8" height="8" fill="#000"/>
              <rect x="718" y="66" width="8" height="8" fill="#000"/>

              <animateTransform
                attributeName="transform"
                type="scale"
                from="0.2"
                to="1"
                begin="4s"
                dur="0.3s"
                fill="freeze"/>
            </g>

            <text x="250"
                  y="45"
                  font-family="monospace"
                  font-size="28"
                  font-weight="bold"
                  fill="#000"
                  opacity="0">

              Back-End Dev

              <set attributeName="opacity"
                   to="1"
                   begin="4.3s"
                   fill="freeze"/>
            </text>

          </svg>
          EOF

      - name: Commit SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto generate vjRider banner"