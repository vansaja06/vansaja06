name: Generate Banner GIF

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-banner:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create Frames
        run: |
          mkdir -p assets/frames

          # Frame 1
          cat > assets/frames/frame1.svg <<'EOF'
          <svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
            <rect width="800" height="120" fill="white"/>
            <line x1="0" y1="90" x2="800" y2="90" stroke="black" stroke-width="2"/>
            <rect x="50" y="60" width="50" height="20" fill="black"/>
            <rect x="720" y="15" width="4" height="75" fill="black"/>
          </svg>
          EOF

          # Frame 2
          sed 's/x="50"/x="250"/' assets/frames/frame1.svg > assets/frames/frame2.svg

          # Frame 3
          sed 's/x="50"/x="500"/' assets/frames/frame1.svg > assets/frames/frame3.svg

          # Frame 4 (crash)
          cat > assets/frames/frame4.svg <<'EOF'
          <svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
            <rect width="800" height="120" fill="white"/>
            <line x1="0" y1="90" x2="800" y2="90" stroke="black" stroke-width="2"/>
            <rect x="650" y="60" width="50" height="20" fill="black"/>
            <rect x="700" y="40" width="8" height="8" fill="black"/>
            <rect x="712" y="50" width="8" height="8" fill="black"/>
            <rect x="720" y="15" width="4" height="75" fill="black"/>
          </svg>
          EOF

          # Frame 5 (text muncul)
          cat > assets/frames/frame5.svg <<'EOF'
          <svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
            <rect width="800" height="120" fill="white"/>
            <line x1="0" y1="90" x2="800" y2="90" stroke="black" stroke-width="2"/>
            <text x="240" y="50"
                  font-family="monospace"
                  font-size="30"
                  font-weight="bold">
              Back-End Dev
            </text>
          </svg>
          EOF

      - name: Convert SVG to PNG
        run: |
          mkdir -p assets/png
          for f in assets/frames/*.svg; do
            convert "$f" "${f%.svg}.png"
          done

      - name: Generate GIF
        run: |
          convert -delay 40 -loop 0 assets/frames/*.png assets/banner.gif

      - name: Commit GIF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update animated banner"